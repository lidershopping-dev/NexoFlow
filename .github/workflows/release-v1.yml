# NexoFlow 1.0
name: Publicar NexoFlow 1.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexoflow-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    if: github.repository == 'felipetelesbarbosa/NexoFlow'
    name: Qualidade e dependências
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Instalar ferramentas de verificação
        run: python -m pip install -r requirements.txt -r requirements-webhook.txt -r requirements-dev.txt
      - name: Validar código e tipos
        run: |
          ruff check .
          pyright
      - name: Auditar dependências
        run: pip-audit -r requirements.txt -r requirements-webhook.txt

  verificar-segredos:
    if: github.repository == 'felipetelesbarbosa/NexoFlow'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do histórico completo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks com SHA-256 conferido
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/nexoflow-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 --output "$scanner_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks

      - name: Verificar segredos em todo o histórico Git
        shell: bash
        run: |
          python3 scripts/check_release_secrets.py \
            --scanner "$RUNNER_TEMP/nexoflow-gitleaks/gitleaks" \
            --mode history --repo "$GITHUB_WORKSPACE"

  validar-python:
    if: github.repository == 'felipetelesbarbosa/NexoFlow'
    name: Testes Python ${{ matrix.python-version }}
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-webhook.txt

      - name: Testar compatibilidade sem APIs reais
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Os testes de compatibilidade Python falharam." }
          python scripts/build_documentation.py --check
          if ($LASTEXITCODE -ne 0) { throw "A documentação HTML está desatualizada." }

      - name: Testar com a codificação padrão do Windows
        shell: pwsh
        env:
          PYTHONUTF8: "0"
        run: |
          python -m unittest discover -s tests -t . -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Os testes de leitura com a codificação padrão do Windows falharam." }

  validar-e-publicar:
    if: github.repository == 'felipetelesbarbosa/NexoFlow'
    needs: [qualidade, verificar-segredos, validar-python]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir padrão da publicação
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne "refs/heads/main") {
            throw "A publicação do NexoFlow 1.0 deve partir da main."
          }
          $commitMessage = (& git log -1 --format=%B | Out-String).TrimEnd([char[]]"`r`n")
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível conferir a mensagem do commit." }
          if ($commitMessage -cne "NexoFlow 1.0") {
            throw "Use exatamente NexoFlow 1.0 como mensagem de commit antes de publicar."
          }

      - name: Python para testes
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-webhook.txt

      - name: Executar testes
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . -p "test_*.py" -v

      - name: Auditoria de consistência
        shell: pwsh
        run: |
          python app/auditar_consistencia.py

      - name: Go para launcher do Setup
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"

      - name: Gerar pacotes 1.0
        shell: pwsh
        run: |
          ./scripts/build_release.ps1 -Version "1.0"

      - name: Validar ícones incorporados nos executáveis
        shell: pwsh
        run: |
          ./scripts/test_executable_icons.ps1 -Version "1.0"

      - name: Testar executável Recompra + BAT no Windows
        shell: pwsh
        run: |
          ./scripts/test_recompra_launcher_windows.ps1

      - name: Smoke test do Setup 1.0 no Windows
        shell: pwsh
        run: |
          ./scripts/test_setup_windows.ps1 -SetupZip "dist/NexoFlow-Setup-1.0.zip"

      - name: Disponibilizar pacotes do NexoFlow 1.0
        if: github.repository == 'felipetelesbarbosa/NexoFlow' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NexoFlow-1.0-pacotes
          path: |
            dist/NexoFlow-Setup-1.0.zip
            dist/NexoFlow-1.0.zip
            dist/SHA256SUMS-1.0.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Resumo
        shell: pwsh
        run: |
          Get-Content "dist/SHA256SUMS-1.0.txt"

  verificar-pacotes:
    if: github.repository == 'felipetelesbarbosa/NexoFlow' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verificar-segredos, validar-e-publicar]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Receber pacotes para análise
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NexoFlow-1.0-pacotes
          path: dist

      - name: Instalar Gitleaks com SHA-256 conferido
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/nexoflow-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 --output "$scanner_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks

      - name: Conferir hashes e verificar segredos dentro dos ZIPs
        shell: bash
        run: |
          python3 scripts/check_release_secrets.py \
            --scanner "$RUNNER_TEMP/nexoflow-gitleaks/gitleaks" \
            --mode packages --repo "$GITHUB_WORKSPACE" --assets-dir "$GITHUB_WORKSPACE/dist"

  publicar:
    if: github.repository == 'felipetelesbarbosa/NexoFlow' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verificar-segredos, validar-e-publicar, verificar-pacotes]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Receber pacotes validados
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NexoFlow-1.0-pacotes
          path: dist

      - name: Conferir o commit atual da main
        shell: pwsh
        run: |
          $remoteMain = (& git ls-remote --exit-code origin refs/heads/main | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível conferir a main antes de publicar." }
          $latestSha = ($remoteMain -split '\s+')[0]
          if ($latestSha -cne $env:GITHUB_SHA) {
            throw "A main recebeu outro commit. O release deve usar a execução mais recente."
          }

      - name: Atualizar tag v1.0
        shell: pwsh
        run: |
          git tag -f v1.0 "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao preparar a tag v1.0." }
          git push origin refs/tags/v1.0 --force
          if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar a tag v1.0." }

      - name: Publicar NexoFlow 1.0 no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0 "dist/NexoFlow-Setup-1.0.zip" "dist/NexoFlow-1.0.zip" "dist/SHA256SUMS-1.0.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar os pacotes do NexoFlow 1.0." }
          gh release edit v1.0 --title "NexoFlow 1.0" --notes-file "dist/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar as notas do NexoFlow 1.0." }
          # Republicar preserva a tag e os arquivos, atualizando a data exibida.
          gh release edit v1.0 --draft
          if ($LASTEXITCODE -ne 0) { throw "Falha ao preparar a republicacao do NexoFlow 1.0." }
          gh release edit v1.0 --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
            # Uma segunda tentativa evita deixar o release em rascunho por falha temporaria.
            gh release edit v1.0 --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Falha ao republicar o NexoFlow 1.0." }
          }

      - name: Resumo
        shell: pwsh
        run: |
          Get-Content "dist/SHA256SUMS-1.0.txt"
